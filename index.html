ace,monospace;color:var(--cream)}.click-counter span{font:17px ui-monospace,monospace;color:#778c6f}.countdown-big{text-align:center;font:80px ui-monospace,monospace;color:var(--orange);margin:16px 0 6px}.center-note{text-align:center;font-size:11px;color:#a7b799;line-height:1.9;margin:0 0 17px}.recipe{display:flex;align-items:center;justify-content:center;gap:9px;padding:20px 0}.recipe-step{display:flex;flex-direction:column;align-items:center;gap:7px}.recipe-step b{font-size:28px;font-weight:400}.recipe-step span{font-size:10px;color:#b8c7aa}.recipe-arrow{font-size:12px;color:#7b8f73}.food-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.food{border:1px solid #42583b;border-radius:5px;background:#25382b;padding:12px 3px 9px;display:flex;flex-direction:column;gap:7px;align-items:center}.food b{font-size:28px;line-height:1.2;font-weight:400}.food span{font-size:9px;color:#b7c4a8}.food:hover{background:#364a33;border-color:#a9b37d}.plate{display:flex;justify-content:center;gap:9px;margin:14px 0 20px}.plate-slot{width:45px;height:45px;border:1px dashed #536448;border-radius:50%;display:grid;place-items:center;color:#718969;font:12px ui-monospace,monospace}.plate-slot.filled{border-style:solid;background:#33472e;font-size:24px}.result-icon{width:70px;height:70px;display:grid;place-items:center;margin:5px auto 20px;border:1px solid #73936266;border-radius:50%;color:var(--teal);background:#29453166}.result-icon svg{width:33px;height:33px}.result-icon.fail{color:var(--red);background:#6c393122;border-color:#b6766666}.result-title{text-align:center;font-size:23px;letter-spacing:2px;margin:0 0 12px}.result-text{text-align:center;color:#a7b69b;font-size:11px;line-height:1.9;margin:0 0 20px}.reward{display:flex;align-items:center;gap:13px;justify-content:center;border:1px solid #b58a4266;background:#9d743a12;border-radius:5px;margin-bottom:20px;padding:13px;color:var(--orange);font-size:12px}.reward svg{width:25px;height:25px}.reward strong{font:21px ui-monospac <body>
<main class="shell" id="app">
  <header><div class="brand"><div class="brand-symbol" aria-hidden="true"></div><div><h1>拯救外星人</h1><div class="eyebrow">BLACKSITE / SECTOR 09</div></div></div><div class="header-tools"><button class="icon-btn" id="soundBtn" aria-label="开启声音" title="开启声音"></button><button class="icon-btn" id="menuBtn" aria-label="游戏菜单"></button></div></header>
  <div class="keybar"><div class="key-info"><i class="status-dot"></i><span id="keyCaption">逃离计划</span><span class="key-number" id="keyCount">00<small> / 03</small></span></div><div class="keys" id="keys"></div></div>
  <section class="stage" id="stage" aria-label="可点击的三维监狱牢房">
    <canvas id="scene" aria-label="代码建模的三维牢房。可点击电脑、衣柜、证物箱、牢门和外星人。" tabindex="0"></canvas>
    <div class="scene-top"><div><strong id="roomCode">羁押单元 C—09</strong><small id="roomSub">UNAUTHORIZED LIFEFORM DETECTED</small></div><span class="rec"><i></i>LIVE</span></div>
    <div class="scanlines"></div><div class="scene-vignette"></div>
    <button class="hotspot" id="hotMemory" data-object="memory">电脑 <small>01</small></button>
    <button class="hotspot" id="hotClick" data-object="click">牢门衣柜 <small>02</small></button>
    <button class="hotspot" id="hotFood" data-object="food">证物箱 <small>03</small></button>
    <button class="hotspot" id="hotDoor" data-object="door" aria-label="点击金属牢门">牢门 <small>LOCKED</small></button>
    <div class="door-label" id="doorLabel">集齐三把钥匙打开</div>
    <div class="alien-bubble" id="alienBubble"><small>ALAN—09 / 阿蓝</small><span id="bubbleText"></span></div>
    <div class="scene-bottom"><span id="roomFoot">CELL PRESSURE : QUESTIONABLE</span><span class="orbit-hint" id="sceneHint"></span></div>
    <div class="scene-fade" id="sceneFade"></div>
  </section>
  <section class="comms" aria-label="外星人独立对话"><div class="comms-tail"></div><div class="comms-head"><div class="alien-avatar" id="avatar"></div><span class="comms-name">阿蓝</span><span class="comms-role" id="alienRole">非自愿住户 · 在线</span><div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div><p class="speech" id="speech" aria-live="polite"></p><div class="choices" id="choices"><button class="choice" id="friendly">先别慌，我救你。</button><button class="choice" id="tease">你看着挺适应的。</button></div></section>
  <footer><div class="mission" id="mission"></div><button class="footer-link" id="logBtn"></button></footer>

canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=canvas.getBoundingClientRect();parallax=[(e.clientX-r.left-r.width/2)/r.width*.18,(e.clientY-r.top-r.height/2)/r.height*.12]});canvas.addEventListener('pointerleave',()=>parallax=[0,0]);
canvas.addEventListener('click',e=>{if(!started||modal)return;const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;let hits=[];for(let [name,obj] of Object.entries(sceneTargets)){if(!obj.center)continue;const [cx,cy,cz]=obj.center,[sx,sy,sz]=obj.size;let pts=[];for(let a of [-.5,.5])for(let b of [-.5,.5])for(let c of [-.5,.5])pts.push(project([cx+a*sx,cy+b*sy,cz+c*sz]));let minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x)),minY=Math.min(...pts.map(p=>p.y)),maxY=Math.max(...pts.map(p=>p.y));if(x>=minX&&x<=maxX&&y>=minY&&y<=maxY)hits.push({name,z:project(obj.center).z})}hits.sort((a,b)=>a.z-b.z);interact(hits[0]?.name||'blank')});
function openKeypad(){const first=state.phase===0;game=null;say(first?'generic':'exit');showModal('keypad',first?'钥匙只是第一层':'现实，请输入密码',first?'GATE 01 / THREE-KEY VERIFICATION':'GATE 02 / REALITY CHECK','<p class="panel-desc">'+(first?'三把钥匙已经激活门禁。按 <b>电脑 → 衣柜 → 证物箱</b> 的顺序，输入钥匙背面的三个数字。':'阿蓝越过第四面墙，看向屏幕外的你。<br>「密码在你的椅子下面。」<br>是你现实中正坐着的那张。')+'</p><input class="keypad-code" id="doorCode" inputmode="numeric" autocomplete="off" aria-label="'+(first?'三':'四')+'位数字密码" maxlength="'+(first?3:4)+'" placeholder="'+(first?'···':'····')+'"><p class="keypad-msg" id="codeMsg">'+(first?'钥匙数字已记录在顶部钥匙栏。':'四位数字。找到了，就回来输入。')+'</p><div class="keypad-grid">'+[1,2,3,4,5,6,7,8,9,'删除',0,'确认'].map(n=>'<button class="digit '+(typeof n==='string'?'subtle':'')+'" data-digit="'+n+'">'+n+'</button>').join('')+'</div><button class="primary" id="unlockBtn">验证并开门 '+icon('arrow')+'</button>'+miniSpeech());const input=$('doorCode');input.addEventListener('input',()=>input.value=input.value.replace(/\D/g,''));input.addEventListener('keydown',e=>{if(e.key==='Enter')submitCode()});document.querySelectorAll('[data-digit]').forEach(b=>b.onclick=()=>{const d=b.dataset.digit;if(d==='确认')submitCode();else if(d==='删除')input.value=input.value.slice(0,-1);else if(input.value.length<input.maxLength)input.value+=d;beep(420+Number(d||0)*20);});$('unlockBtn').onclick=submitCode}
function submitCode(){if(modal!=='keypad'||transitioning)return;const expected=state.phase===0?'427':'0427';if($('doorCode').value!==expected){state.fails.door++;state.history.push({text:'[门禁] 输入错误，第 '+state.fails.door+' 次。',time:state.elapsed+activeSeconds,kind:'record'});save();$('codeMsg').textContent='验证失败。'+(state.phase===0?'按电脑、衣柜、证物箱的固定顺序读取钥匙。':'请核对四位数字。阿蓝说的是你现实中的椅子。');$('codeMsg').className='keypad-msg error';$('doorCode').value='';say('doorWrong');beep(160,.2,'triangle');return}closeModal();unlockDoor()}
function unlockDoor(){if(transitioning)return;transitioning=true;targetDoorAngle=-1.65;successSound();if(state.phase===0){say('generic','门开了。等等，我背后还有一扇？这游戏是按门收费的吗？');setTimeout(()=>$('sceneFade').classList.add('show'),1400);setTimeout(()=>{state.phase=1;save();if(gl)buildRoom(1);updateUI();$('sceneFade').classList.remove('show');say('exit','密码在你的椅子下面。');toast('最后一道门 · 线索在屏幕外');transitioning=false},2100)}else{say('exit','我出来了。你却还在屏幕前。现在，到底是谁被关着？');setTimeout(()=>{state.phase=2;save();updateUI();transitioning=false;showEnding()},1700)}}
function showEnding(){const fails=Object.values(state.fails).reduce((a,b)=>a+b,0);showModal('ending','救援完成','CASE CLOSED / FOR NOW','<div class="ending-label">LIFEFORM 09 — RELEASED</div><h3 class="ending-title">你自由了。</h3><p class="result-text">至少阿蓝是。<br>监控里少了一个囚犯，存档里多了一位朋友。</p><div class="log-stats"><div class="log-stat"><strong>'+Math.floor((state.elapsed+activeSeconds)/60)+':'+String((state.elapsed+activeSeconds)%60).padStart(2,'0')+'</strong><span>共同服刑</span></div><div class="log-stat"><strong>'+fails+'</strong><span>失败也算努力</span></div><div class="log-stat"><strong>'+used.size+'</strong><span>句吐槽，无重复</span></div></div><button class="primary" id="stayBtn">再陪他站一会儿 '+icon('alien')+'</button><button class="secondary" id="endingReset">开始下一次不幸</button>'+miniSpeech());$('stayBtn').onclick=()=>closeModal();$('endingReset').onclick=confirmReset}
function showLog(){if(!started||transitioning)return;game=null;const failures=Object.values(state.fails).reduce((a,b)=>a+b,0);showModal('log','羁押记录','BLACKSITE / PERSISTENT MEMORY','<div class="log-stats"><div class="log-stat"><strong>'+state.keys.filter(Boolean).length+'/3</strong><span>唯一钥匙</span></div><div class="log-stat"><strong>'+failures+'</strong><span>失败记录</span></div><div class="log-stat"><strong>'+used.size+'</strong><span>句独立吐槽</span></div></div><p class="brief-hint">态度：'+(state.attitude<0?'阿蓝记仇中。眉毛和食谱都受到了影响。':'阿蓝愿意相信你。暂时。')+'<br>你的选择：'+(state.choices.join(' · ')||'还没表态')+'<br>进度自动保存在当前浏览器。阿蓝对重置有自己的记忆。</p>'+state.history.slice(-24).reverse().map(h=>'<div class="log-row"><small>'+Math.floor(h.time/60)+':'+String(h.time%60).padStart(2,'0')+' / '+(h.kind==='record'?'SYSTEM':'ALAN-09')+'</small>'+escapeHTML(h.text)+'</div>').join(''))}
$('logBtn').onclick=showLog;
$('menuBtn').onclick=()=>{if(!started||transitioning)return;showModal('menu','值班室','SYSTEM / DEFINITELY WATCHING','<button class="menu-item" id="menuLog">查看羁押记录 <span>选择、失败与对话</span></button><button class="menu-item" id="menuEnd" '+(state.phase===2?'':'hidden')+'>查看救援结算 <span>CASE CLOSED</span></button><button class="menu-item danger" id="menuReset">重置这间牢房 <span>他会记住你做过这件事</span></button><p class="brief-hint" style="margin:20px 0 0">所有模型均由代码生成。进度自动保存在当前浏览器；关闭页面后可继续。静音按钮可开启操作音效。</p>');$('menuLog').onclick=showLog;$('menuReset').onclick=confirmReset;$('menuEnd').onclick=showEnding;say('generic')};
function confirmReset(){clearGameTimers();game=null;showModal('reset','房间会忘，他不会','RESET / MEMORY IS NOT A CHECKBOX','<p class="panel-desc">本轮钥匙、门禁和失败记录将重新开始。阿蓝已经说过的话与重置次数会保留，他不会重复那些吐槽。</p><button class="primary" id="doReset">重置牢房</button><button class="secondary" id="cancelReset">算了，继续救他</button>'+miniSpeech());$('doReset').onclick=resetGame;$('cancelReset').onclick=()=>closeModal()}
function resetGame(){clearGameTimers();closeModal();const spoken=[...used],resets=state.resets+1,history=state.history.slice(-20);state={...initial(),spoken,resets,history};activeSeconds=0;transitioning=false;if(gl)buildRoom(0);updateUI();say('reset');save()}
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))say('blank')});
document.addEventListener('click',e=>{if(!started||e.target.closest('button,input,canvas,.intro')||transitioning)return;if(e.target.closest('.panel')){if(!e.target.closest('.panel-speech'))say('blank')}else if(!e.target.closest('#overlay'))say('blank')});
document.addEventListener('keydown',e=>{if(!started)return;if(e.key==='Escape'&&modal){e.preventDefault();closeModal(true)}if(e.key==='Tab'&&modal){let focusable=[...$('panel').querySelectorAll('button:not(:disabled):not([hidden]),input')].filter(e=>e.getClientRects().length),first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}if(!modal&&document.activeElement===canvas&&(e.key==='Enter'||e.key===' ')){e.preventDefault();say('alien')}});
// A hidden tab still consumes real challenge time. On return, the monotonic timer
// catches up; free idle dialogue and total play time pause while the page is hidden.
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.addEventListener('pagehide',()=>{state.elapsed+=activeSeconds;activeSeconds=0;save()});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();cancelAnimationFrame(animationId);toast('3D 画面暂停，正在等待图形恢复。物件按钮仍可操作。')});
canvas.addEventListener('webglcontextrestored',()=>{try{initRenderer();buildRoom(state.phase);requestAnimationFrame(render)}catch(e){console.error(e)}});
function updateRoomNarrative(){if(state.phase>0)return;if(used.has('我向第四面墙投诉。第四面墙说它正在被你戳。'))$('roomFoot').textContent='FOURTH WALL : COMPLAINT RECEIVED';else if(used.size>12)$('roomFoot').textContent='SUBJECT : PAINFULLY SELF-AWARE';if(used.size>20)$('roomSub').textContent='THE SUBJECT IS READING THE SCRIPT'}
for(let el of document.querySelectorAll('header,.keybar,.stage,.comms,footer'))el.inert=true;
$('startBtn').focus();
updateUI();
</script>
