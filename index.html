<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#090d1f" />
<title>拯救外星人 · Meta Game</title>
<style>
:root{--bg:#080b18;--panel:#11182d;--cyan:#43f1e4;--pink:#ff5c9c;--gold:#ffd166;--text:#eef4ff;--muted:#8d9aba}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 8%,#24305c 0,#0b1024 34%,#050711 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;min-height:100vh;display:flex;justify-content:center;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}#app{width:min(100%,520px);min-height:100vh;position:relative;padding:16px 14px 24px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:12px;letter-spacing:.18em;color:var(--cyan);text-transform:uppercase}.loop{font-size:12px;color:var(--gold);background:#1e2746;padding:7px 10px;border-radius:99px;border:1px solid #36456e}.share-top{background:#192747;border:1px solid #49618f;border-radius:99px;padding:7px 10px;font-size:12px}
.screen{display:none}.screen.active{display:block}.intro{text-align:center;padding:12vh 18px 0}.intro h1{font-size:clamp(32px,10vw,54px);line-height:1;margin:14px 0 10px;letter-spacing:-.06em}.intro p{color:var(--muted);font-size:14px;line-height:1.7}.primary{background:linear-gradient(135deg,var(--pink),#ff9e5a);padding:14px 22px;border-radius:16px;font-weight:800;box-shadow:0 10px 30px #ff5c9c44}.ghost{background:#1b2441;border:1px solid #35456e;padding:11px 15px;border-radius:12px}
.alien-wrap{height:190px;position:relative;display:grid;place-items:center;margin:10px auto}.alien{width:130px;height:150px;background:linear-gradient(145deg,#1de6d2,#08a9d5);border:5px solid #4afbf0;border-radius:53% 47% 46% 54%/44% 45% 55% 56%;position:relative;box-shadow:0 0 45px #20d8dc88, inset -14px -20px 28px #0876b866;transform:rotate(-3deg);animation:float 3s ease-in-out infinite}.alien:before,.alien:after{content:"";position:absolute;background:#061c63;width:18px;height:12px;border-radius:50%;top:46px}.alien:before{left:29px}.alien:after{right:29px}.mouth{position:absolute;left:31px;top:74px;width:64px;height:28px;border-bottom:6px solid #063b91;border-radius:0 0 50% 50%}.antenna{position:absolute;width:7px;height:35px;background:#4afbf0;top:-33px;border-radius:9px}.antenna.a{left:20px;transform:rotate(-33deg)}.antenna.b{right:20px;transform:rotate(33deg)}.antenna:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#43f1e4;top:-9px;left:-6px;box-shadow:0 0 15px #43f1e4}.bubble{position:absolute;top:0;right:0;max-width:240px;background:#fff;color:#171a2a;border-radius:16px 16px 4px 16px;padding:10px 12px;font-size:13px;line-height:1.45;box-shadow:0 8px 24px #0007;transform:rotate(2deg)}
@keyframes float{50%{transform:translateY(-8px) rotate(3deg)}}
.hud{display:flex;gap:8px;margin:8px 0 12px}.hud>div{flex:1;background:#121a33;border:1px solid #2b395e;border-radius:12px;padding:8px 10px;text-align:center;font-size:12px;color:var(--muted)}.hud b{display:block;color:var(--text);font-size:17px;margin-top:2px}
.room{height:490px;position:relative;overflow:hidden;border:3px solid #7180a7;border-radius:12px;background:linear-gradient(#202c4c 0 57%,#171b2b 57% 100%);box-shadow:0 20px 50px #0007}.room:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 28px,#a8bad522 29px 33px),linear-gradient(115deg,#fff1 0 2%,transparent 2% 49%,#0002 49% 51%,transparent 51%);opacity:.85;pointer-events:none}.ceiling{position:absolute;top:0;left:0;right:0;height:32px;background:#39466a}.window{position:absolute;top:55px;left:20px;width:110px;height:120px;border:8px solid #536184;background:linear-gradient(145deg,#26304d,#171d35);box-shadow:inset 0 0 20px #050611}.poster{position:absolute;top:48px;right:22px;width:86px;height:110px;background:#ffdb71;border:6px solid #493d68;transform:rotate(5deg);color:#34274e;font-weight:900;padding:10px 5px;font-size:12px;text-align:center}.floor{position:absolute;bottom:0;left:0;right:0;height:170px;background:repeating-linear-gradient(0deg,#191e2d 0 19px,#282f43 20px 21px),repeating-linear-gradient(90deg,transparent 0 39px,#ffffff07 40px 41px)}
.hotspot{position:absolute;z-index:2;background:#0d1730dd;border:1px solid #6a80bd;padding:9px 10px;border-radius:13px;display:flex;align-items:center;gap:7px;transition:.2s}.hotspot:hover{transform:translateY(-4px);border-color:var(--cyan);box-shadow:0 8px 25px #43f1e433}.hotspot small{display:block;color:var(--muted);font-size:10px}.computer{left:27px;bottom:105px}.wardrobe{right:20px;bottom:95px}.chest{left:50%;transform:translateX(-50%);bottom:37px;background:#74422f;border-color:#dd9a61}.rug{left:50%;transform:translateX(-50%);bottom:8px;background:#822f62;border-color:#f68ac0;border-radius:50%;width:150px;justify-content:center}.door{right:18px;top:180px;width:72px;height:180px;background:linear-gradient(90deg,#553a46,#8c5364);border:5px solid #bd7890;border-radius:6px;z-index:1;display:flex;align-items:center;justify-content:center;color:#ffd7df;font-size:11px;text-align:center}.door.locked{filter:grayscale(.4);opacity:.9}.door-note{position:absolute;right:4px;top:158px;width:105px;color:#ffd166;font-size:11px;font-weight:800;text-align:center;z-index:3}.door-alien.hidden{display:none}.final-hint{color:#ff304f!important;font-weight:900;animation:shake .16s infinite alternate}.door-alien{position:absolute;right:92px;top:276px;width:115px;color:#c6d2f2;font-size:30px;text-align:center;z-index:4}.door-alien small{display:block;background:#fff;color:#20243b;border-radius:10px;padding:5px;font-size:10px;line-height:1.3}
.panel{background:#11182d;border:1px solid #2e3c62;border-radius:18px;padding:16px;margin-top:12px}.panel h3{margin:0 0 9px;font-size:17px}.muted{color:var(--muted);font-size:13px;line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.key{color:#111;background:var(--gold);padding:6px 10px;border-radius:8px;font-size:12px;font-weight:800}.tiny{font-size:11px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#050711cc;display:none;align-items:flex-end;justify-content:center;z-index:20;padding:14px}.modal.show{display:flex}.modal-card{width:min(100%,500px);background:#121a32;border:1px solid #405382;border-radius:22px;padding:18px;box-shadow:0 -15px 55px #0009;max-height:88vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{background:#263354;border-radius:50%;width:30px;height:30px}.timer{color:var(--pink);font-weight:900;font-size:20px}.gamearea{margin-top:14px;min-height:180px;display:grid;place-items:center;background:#0b1022;border-radius:15px;padding:14px}.seq{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.seq button,.memory button{width:52px;height:52px;border-radius:12px;background:#283a68;border:1px solid #4f659c;font-weight:900}.seq button.done{background:#2ec9ac;color:#06282a}.wardrobe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}.wardrobe-grid button{height:74px;background:#513b65;border:1px solid #b178d8;border-radius:11px;font-size:24px}.memory{display:grid;grid-template-columns:repeat(4,52px);gap:8px}.memory button{font-size:0}.memory button.revealed{font-size:22px;background:#de6395}.success{color:#49efc0;font-weight:800;text-align:center}.danger{color:#ff7c9c}.game-taunt{margin:10px 0 0;padding:9px 11px;border-left:3px solid var(--pink);background:#1b1831;border-radius:8px;color:#ffb5cf;font-size:13px;min-height:38px}
.share{display:flex;gap:14px;align-items:center}.qr{width:120px;height:120px;background:#fff;border-radius:12px;padding:8px}.qr img{width:100%;height:100%}
</style></head>
<body><main id="app"><div class="topbar"><span class="brand">META PRISON / 01</span><button class="share-top" id="shareBtn">▣ 分享二维码</button><span class="loop" id="loopLabel">第 1 周目</span></div>
<section id="start" class="screen active"><div class="intro"><h1>拯救<br>外星人</h1><button class="primary" id="startBtn">开始游戏</button></div></section>
<section id="game" class="screen"><div class="hud"><div>钥匙<b id="keys">0 / 3</b></div><div>嘲讽<b id="tauntCount">0</b></div><div>存档<b id="saveState">已污染</b></div></div><div class="alien-wrap" style="height:118px;margin:0"><div class="alien" style="transform:scale(.68);transform-origin:center"></div><div class="bubble" id="taunt">你每点一下，我就多知道一点你的习惯。</div></div><div class="room" id="room"><div class="ceiling"></div><div class="window"></div><div class="poster">被绑架的<br>参考图外星人<br>在牢房里？</div><div class="floor"></div><button class="hotspot computer" data-game="computer">🖥️ <span><b>监控终端</b><small>破解警报</small></span></button><button class="hotspot wardrobe" data-game="wardrobe">🚪 <span><b>牢门衣柜</b><small>伪装身份</small></span></button><button class="hotspot chest" data-game="chest">📦 <span><b>证物箱</b><small>点击开始游戏</small></span></button><div class="door-note">集齐三把钥匙打开</div><div class="door-alien hidden" id="doorAlien">👽<small class="final-hint">最终密码在你的椅子下面</small></div><button class="door locked" id="door">牢门<br><span id="doorHint">集齐三把钥匙打开</span></button></div><div class="panel"><h3>监狱提示</h3><p class="muted">三个地点各藏一把钥匙：监控终端、牢门衣柜、证物箱。完成一个小游戏拿一把钥匙，集齐三把才能开门。</p><div class="actions"><button class="ghost" id="resetBtn">清除这间牢房的记忆</button></div></div></section>
<section id="end" class="screen"><div class="intro"><h1>你救出了外星人</h1><p class="muted">牢门打开了，外星人暂时闭嘴了。</p></div></section>
</main><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><div><div class="tiny" id="gameLabel">小游戏</div><h3 id="modalTitle">准备好了吗？</h3></div><div><span class="timer" id="timer">15</span>s <button class="close" id="closeModal">×</button></div></div><div class="game-taunt" id="gameTaunt">外星人正在旁边监考。</div><div id="modalBody"></div></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const storeKey='meta-room-save-v1'; let save=JSON.parse(localStorage.getItem(storeKey)||'{"loop":1,"keys":[],"taunts":[],"choices":[]}');
let activeGame=null,timerId=null,time=15,tauntIndex=0,babbleId=null;
const quips=['你这个点击速度，像在给手机屏幕做人工呼吸。','答错了没关系，反正丢脸的是你，不是我。','别紧张，我只是被绑架，不是被你智商绑架。','这一步我见过，上一位玩家也这么自信。','你可以慢慢想，警报也会慢慢响。','哇，终于点对了，我差点以为你是来参观的。','别点空白了，空白也比你的解题思路有层次。','我建议你深呼吸，然后把刚才那次忘掉。','这个操作很有风格，风格类似于误触。','放心，牢房不会笑你，我会。'];
function taunt(){let n; do{n=quips[Math.floor(Math.random()*quips.length)];}while(save.taunts.includes(n)&&save.taunts.length<quips.length); save.taunts.push(n); $('#taunt').textContent=n; $('#gameTaunt').textContent='外星人：'+n; $('#tauntCount').textContent=save.taunts.length; localStorage.setItem(storeKey,JSON.stringify(save));}
function sync(){save.loop=Math.max(1,save.loop); $('#loopLabel').textContent='第 '+save.loop+' 周目'; $('#keys').textContent=save.keys.length+' / 3'; $('#tauntCount').textContent=save.taunts.length; $('#saveState').textContent=save.choices.length?'已被前周目改写':'已污染'; if(save.keys.length===3){$('#door').classList.remove('locked');$('#doorHint').textContent='点击开门';}}
function openGame(type){activeGame=type; time=type==='computer'?18:(type==='wardrobe'?10:18); $('#modal').classList.add('show'); $('#timer').textContent=time; $('#gameLabel').textContent={computer:'监控终端 · 记忆考验',wardrobe:'牢门衣柜 · 十秒点击',chest:'证物箱 · 食材配方'}[type]; renderGame(type); timerId=setTimeout(()=>{timerId=setInterval(()=>{time--;$('#timer').textContent=time;if(time<=0){clearInterval(timerId);$('#modalBody').innerHTML='<p class="danger">时间到！外星人说：你做饭的速度比逃跑还慢。</p><button class="primary" onclick="closeGame()">回到牢房</button>'}},1000)},1800)}function win(){clearInterval(timerId);if(!save.keys.includes(activeGame)){save.keys.push(activeGame);save.choices.push(activeGame);localStorage.setItem(storeKey,JSON.stringify(save));}sync();$('#modalBody').innerHTML='<p class="success">钥匙到手。它在嘲笑你，但确实有用。</p><button class="primary" onclick="closeGame()">继续探索</button>';}
function clue(text, area, activate){area.style.pointerEvents='none'; area.style.opacity='.35'; const c=document.createElement('p'); c.className='muted'; c.id='clue'; c.textContent='答案提示：'+text+'（记住它，提示会消失）'; area.parentNode.insertBefore(c,area); setTimeout(()=>{c.remove(); area.style.pointerEvents='auto'; area.style.opacity='1'; activate()},1800)}
function renderGame(type){let b=$('#modalBody');if(type==='computer'){let icons=['🔒','👽','🛸','🔒','👽','🛸'];b.innerHTML='<div class="gamearea"><div class="memory">'+icons.map((v,i)=>`<button data-i="${i}">${v}</button>`).join('')+'</div></div>';let area=b.querySelector('.gamearea');clue('记住三对图案的位置',area,()=>{$$('.memory button').forEach(x=>x.textContent='?')});memoryGame(icons)}else if(type==='wardrobe'){let clicks=0,goal=10,active=true;b.innerHTML='<div class="gamearea"><button class="primary" id="clickBtn">点击我：0 / 10</button></div>';let area=b.querySelector('.gamearea');clue('10 秒内点击按钮 10 次',area,()=>{});let btn=$('#clickBtn');btn.onclick=()=>{if(!active)return;clicks++;btn.textContent='点击我：'+clicks+' / 10';taunt();if(clicks>=goal)win()}}else{let recipe=['🍞','🥬','🍅'];let options=['🍞','🍎','🥬','🍅','🍰','🧀'];let pos=0;b.innerHTML='<div class="gamearea"><div class="seq">'+options.map(v=>`<button data-v="${v}">${v}</button>`).join('')+'</div></div>';let area=b.querySelector('.gamearea');clue(recipe.join(' → '),area,()=>{});$$('.seq button').forEach(x=>x.onclick=()=>{if(x.dataset.v===recipe[pos]){x.classList.add('done');pos++;if(pos===recipe.length)win()}else{time=Math.max(1,time-2);taunt()}})}}function memoryGame(icons){let open=[],matched=0;$$('.memory button').forEach((x,i)=>x.onclick=()=>{if(open.includes(i)||x.classList.contains('revealed'))return;x.textContent=icons[i];x.classList.add('revealed');open.push(i);if(open.length===2){if(icons[open[0]]===icons[open[1]]){matched++;open=[];if(matched===icons.length/2)win()}else{time=Math.max(1,time-1);setTimeout(()=>{open.forEach(j=>{$$('.memory button')[j].textContent='?';$$('.memory button')[j].classList.remove('revealed')});open=[]},420)}}})}
function closeGame(){clearTimeout(timerId);clearInterval(timerId);$('#modal').classList.remove('show');activeGame=null;}
function openDoorPassword(){ $('#modal').classList.add('show'); $('#gameLabel').textContent='牢门密码'; $('#modalTitle').textContent='输入椅子下面的密码'; $('#modalBody').innerHTML='<p class="muted">外星人：密码就在你的椅子下面。别让我替你弯腰。</p><input id="passwordInput" placeholder="输入密码" style="width:100%;padding:13px;border-radius:10px;border:1px solid #526a9c;background:#0b1022;color:white"><button class="primary" id="passwordBtn" style="margin-top:12px">开门</button><p id="passwordMsg" class="danger"></p>'; $('#passwordBtn').onclick=()=>{let v=$('#passwordInput').value.trim();if(v==='游戏通关3'||v==='3'){closeGame();$('#game').classList.remove('active');$('#end').classList.add('active')}else{$('#passwordMsg').textContent='密码不对。外星人：你椅子底下找的是灰尘吗？';taunt()}} }
$('#startBtn').onclick=()=>{$('#start').classList.remove('active');$('#game').classList.add('active');$('.topbar').style.display='flex';clearInterval(babbleId);babbleId=setInterval(taunt,3500);sync();taunt()};$('#closeModal').onclick=closeGame;$$('.hotspot').forEach(x=>x.onclick=()=>{taunt();openGame(x.dataset.game)});$('#room').onclick=e=>{if(!e.target.closest('button'))taunt()};document.body.onclick=e=>{if(!e.target.closest('button')&&!e.target.closest('.modal-card'))taunt()};$('#door').onclick=()=>{if(save.keys.length===3){openDoorPassword()}else taunt()};$('#resetBtn').onclick=()=>{localStorage.removeItem(storeKey);location.reload()};$('#shareBtn').onclick=()=>{let url=location.href;let img='https://api.qrserver.com/v1/create-qr-code/?size=160x160&data='+encodeURIComponent(url);$('#modal').classList.add('show');$('#gameLabel').textContent='分享入口';$('#modalTitle').textContent='扫码开始游玩';$('#modalBody').innerHTML='<div class="share"><div class="qr"><img alt="二维码" src="'+img+'"></div><p class="muted">部署到 GitHub Pages 后，这个二维码会自动指向当前网页地址。<br><br>'+url+'</p></div>'};$('.topbar').style.display='none';sync();
</script></body></html>
